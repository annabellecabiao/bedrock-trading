name: Build & Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: acrbedrocktrading
  CONTAINER_APP_NAME: bedrock-trading-app
  RESOURCE_GROUP: rg-bedrock-prod
  CONTAINER_APP_ENV: env-bedrock

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/bedrock-trading:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/bedrock-trading:latest .
          docker push ${{ env.ACR_NAME }}.azurecr.io/bedrock-trading:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/bedrock-trading:latest

      - name: Deploy to Azure Container Apps (Preserves Storage Volumes)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/bedrock-trading:${{ github.sha }}
